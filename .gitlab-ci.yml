image: gcc:16@sha256:07280eb2e744f1b7a2d8d4a3894c089ea07266c109758afc388a634bd098e4eb

stages:
  - test
  - deploy

coverage:
  stage: test
  before_script:
    - apt-get update && apt-get install -y git gcovr=7.2+really-1.1 libgcrypt20-dev libcurl4-gnutls-dev libcmocka-dev
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - make coverage-report
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
  coverage: '/Lines executed:\s+(\d+\.\d+)%/'

pages:
  stage: deploy
  needs:
    - job: coverage
      artifacts: true
  script:
    - mkdir -p public
    - cp -R coverage/. public/
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
